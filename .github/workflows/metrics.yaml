name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
      timezone: "Asia/Bangkok"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # The upstream collector exits after a timeout and compares each page with
      # the total repository limit. Patch that module in the existing image.
      - name: Repair Metrics repository pagination
        env:
          METRICS_BASE_IMAGE: ghcr.io/lowlighter/metrics@sha256:b8013996b12be3ea049fad2e18db6b31083575a197e43ed63a690a094b9164fb
        run: |
          image_context=$(mktemp -d)
          container_id=$(docker create "$METRICS_BASE_IMAGE")
          trap 'docker rm "$container_id" >/dev/null; rm -rf "$image_context"' EXIT
          docker cp "$container_id:/metrics/source/plugins/base/index.mjs" "$image_context/base.mjs"
          docker cp "$container_id:/metrics/source/app/action/index.mjs" "$image_context/action.mjs"
          docker cp "$container_id:/metrics/source/plugins/habits/index.mjs" "$image_context/habits.mjs"
          python3 .github/scripts/patch-metrics-pagination.py "$image_context/base.mjs" "$image_context/action.mjs" "$image_context/habits.mjs"
          node .github/scripts/test-metrics-pagination.mjs "$image_context/base.mjs"
          node .github/scripts/test-metrics-habits.mjs "$image_context/habits.mjs"
          cat > "$image_context/Dockerfile" <<EOF
          FROM $METRICS_BASE_IMAGE
          COPY base.mjs /metrics/source/plugins/base/index.mjs
          COPY action.mjs /metrics/source/app/action/index.mjs
          COPY habits.mjs /metrics/source/plugins/habits/index.mjs
          EOF
          docker build --tag metrics:3.34.0 "$image_context"

      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          use_prebuilt_image: no
          debug: no
          plugins_errors_fatal: yes
          user: razyoboy
          base: ""
          
          repositories_affiliations: owner
          repositories: 200
          repositories_batch: 25
          
          filename: github-metrics.svg
          output_action: none
         

          config_timezone: Asia/Bangkok
          config_display: regular
          config_order: isocalendar, habits

          # Contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_languages: no

          # Coding habits and mildly interesting facts, without languages
          plugin_habits: yes
          plugin_habits_from: 300
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_languages_limit: 0

      - name: Verify calendar and habits without language charts
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "/metrics_renders/github-metrics.svg"
          root = ET.parse(path).getroot()
          text = " ".join(" ".join(root.itertext()).split())
          assert "Contributions calendar" in text, "Contribution calendar is missing"
          assert "Recent coding habits" in text, "Coding habits are missing"
          assert text.index("Contributions calendar") < text.index("Recent coding habits"), "Calendar must appear before habits"
          assert "Commit activity per hour of day" in text, "Hourly activity chart is missing"
          assert "Commit activity per day of week" in text, "Weekday activity chart is missing"
          assert any("facts" in node.get("class", "").split() and len(node) for node in root.iter()), "Coding facts are missing"
          assert not any(node.get("id") == "languages-bar" for node in root.iter()), "The old language chart is still present"
          assert "Most used languages" not in text and "Language activity" not in text, "Language sections must stay disabled"
          assert not any("error" in node.get("class", "").split() for node in root.iter()), "Metrics rendered a plugin error"
          print("Verified: half-year calendar followed by coding habits and facts, without language charts.")
          PY

      - name: Commit verified Metrics on main
        if: github.ref == 'refs/heads/main'
        run: |
          cp /metrics_renders/github-metrics.svg github-metrics.svg
          if git diff --quiet -- github-metrics.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg
          git commit -m "Update github-metrics.svg [skip ci]"
          git push
